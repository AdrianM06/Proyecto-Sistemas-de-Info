mutation CreateAthlete($data: Athlete_Data!) @auth(level: USER) {
  athlete_insert(data: $data)
}

mutation UpdateAthlete($id: UUID!, $data: Athlete_Data!) @auth(level: USER) {
  athlete_update(id: $id, data: $data)
}

mutation DeleteAthlete($id: UUID!) @auth(level: USER) {
  athlete_delete(id: $id)
}

query GetAthlete($id: UUID!) @auth(level: USER) {
  athlete(id: $id) {
    name studentId position jerseyNumber team { name }
  }
}

query ListAthletes @auth(level: USER) {
  athletes {
    name studentId position jerseyNumber
  }
}

mutation CreateMatch($data: Match_Data!) @auth(level: USER) {
  match_insert(data: $data)
}

mutation UpdateMatch($id: UUID!, $data: Match_Data!) @auth(level: USER) {
  match_update(id: $id, data: $data)
}

mutation DeleteMatch($id: UUID!) @auth(level: USER) {
  match_delete(id: $id)
}

query GetMatch($id: UUID!) @auth(level: PUBLIC, insecureReason: "Match data is publicly available for spectators.") {
  match(id: $id) {
    tournament { name } homeTeam { name } awayTeam { name } date homeScore awayScore venue
  }
}

query ListMatches @auth(level: PUBLIC, insecureReason: "Match schedules are public info.") {
  matches {
    tournament { name } homeTeam { name } awayTeam { name } date
  }
}

