query GetTeam($id: UUID!) @auth(level: PUBLIC, insecureReason: "Team rosters and info are public.") {
  team(id: $id) {
    name sportType university { name }
  }
}

query ListTeams @auth(level: PUBLIC, insecureReason: "Publicly list teams to users.") {
